name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.PAISA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PAISA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/paisa-release.jks"
          echo "PAISA_KEYSTORE_PATH=$RUNNER_TEMP/paisa-release.jks" >> "$GITHUB_ENV"
          echo "PAISA_KEYSTORE_PASSWORD=${{ secrets.PAISA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "PAISA_KEY_ALIAS=${{ secrets.PAISA_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "PAISA_KEY_PASSWORD=${{ secrets.PAISA_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Test and build APKs
        run: |
          set -o pipefail
          ./gradlew test assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Failure summary
        if: failure()
        run: |
          echo "===== compile / build errors ====="
          grep -aE "^(e: |FAILURE:|\* What went wrong|Caused by:)" build.log | head -60 || true
          echo "===== failing tests ====="
          grep -aE "FAILED|AssertionError" build.log | head -20 || true

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/paisa-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/paisa-release.apk
          ls -la artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: paisa-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish a release with both APKs
        if: github.ref_name == 'claude/prepare-apk-7duemf'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "Paisa — latest build" \
              --notes "Debug and release APKs, built from the latest push." \
              --target "${{ github.sha }}"
          gh release upload latest-build artifacts/paisa-debug.apk artifacts/paisa-release.apk --clobber

      - name: Commit the release APK
        if: github.ref_name == 'claude/prepare-apk-7duemf'
        run: |
          mkdir -p dist
          cp artifacts/paisa-release.apk dist/paisa-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dist)" ]; then
            git add dist/paisa-release.apk
            git commit -m "Release APK from the latest build [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  emulator:
    name: Run on emulator
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both APKs
        # The smoke pass runs against the release build, so it has to exist here.
        run: ./gradlew assembleDebug assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/emulator_run.sh

      - name: Write run report
        if: always()
        run: python3 scripts/report.py

      - name: Commit screenshots and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs)" ]; then
            git add docs
            git commit -m "Emulator run results [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "nothing to commit"
          fi

      - name: Fail if the emulator run failed
        if: always()
        run: |
          grep -q "tests_exit=0" /tmp/status \
            && grep -q "demo_exit=0" /tmp/status \
            && grep -q "smoke_exit=0" /tmp/status

      - name: Upload full-size screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: /tmp/*-full.png
          if-no-files-found: ignore
