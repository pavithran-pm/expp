name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build APKs
        run: |
          set -o pipefail
          ./gradlew test assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Failure summary
        if: failure()
        run: |
          echo "===== compile / build errors ====="
          grep -aE "^(e: |w: \[ksp\]|FAILURE:|\* What went wrong|Caused by:|> )" build.log | head -40 || true
          echo "===== failing tests ====="
          grep -aE "FAILED|AssertionError" build.log | head -20 || true

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/paisa-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/paisa-release.apk
          ls -la artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: paisa-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
